name: Docker

# Images are published on release tags only: production pins tags by digest and
# nothing consumes main-branch images. PRs build only when an image's build
# inputs change; source changes are covered by the CI workflow.
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - '*/Dockerfile*'
      - '*/.dockerignore'
      - '*/uv.lock'
      - '*/pyproject.toml'
      - 'frontend/package*.json'
      - 'docker/**'
      - '.env.docker.example'
      - '.github/workflows/docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: Detect changed images
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker_backend: ${{ steps.filter.outputs.docker_backend }}
      docker_frontend: ${{ steps.filter.outputs.docker_frontend }}
      docker_mcp: ${{ steps.filter.outputs.docker_mcp }}
      docker_config: ${{ steps.filter.outputs.docker_config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          filters: |
            docker_backend:
              - 'backend/Dockerfile*'
              - 'backend/.dockerignore'
              - 'backend/uv.lock'
              - 'backend/pyproject.toml'
            docker_frontend:
              - 'frontend/Dockerfile*'
              - 'frontend/.dockerignore'
              - 'frontend/package*.json'
            docker_mcp:
              - 'mcp/Dockerfile*'
              - 'mcp/.dockerignore'
              - 'mcp/uv.lock'
              - 'mcp/pyproject.toml'
            docker_config:
              - 'docker/**'
              - '.env.docker.example'
              - '.github/workflows/docker.yml'

  # PR validation: build only, read-only token, no GHCR login, no push.
  # permissions cannot be expressions, so PR-read-only vs publish-write is split
  # into two jobs gated by github.event_name.
  build-validate:
    name: Build (validate) ${{ matrix.image }} image
    needs: changes
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile.prod
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.prod
          - image: mcp
            context: mcp
            dockerfile: mcp/Dockerfile.prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Decide whether to build this image
        id: gate
        # matrix + needs are available at step level (not at job-level if:).
        run: |
          echo "build=${{ needs.changes.outputs.docker_config == 'true' || needs.changes.outputs[format('docker_{0}', matrix.image)] == 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        if: ${{ steps.gate.outputs.build == 'true' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=pr

      - name: Set up Buildx
        if: ${{ steps.gate.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and load for scanning (no push)
        if: ${{ steps.gate.outputs.build == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Harmless for backend/mcp (their Dockerfiles ignore unknown args);
          # supplies the production value the frontend Dockerfile.prod expects.
          build-args: |
            VITE_API_URL=/api/v2

      - name: Scan container image for vulnerabilities (Trivy)
        if: ${{ steps.gate.outputs.build == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # Publish: v* tags only. Only this job gets packages: write. All three images
  # build for a coherent release set.
  publish:
    name: Publish ${{ matrix.image }} image
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
            dockerfile: backend/Dockerfile.prod
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.prod
          - image: mcp
            context: mcp
            dockerfile: mcp/Dockerfile.prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Keep :latest pointing at the newest release for anyone pulling it.
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            VITE_API_URL=/api/v2
