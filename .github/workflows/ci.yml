name: CI

on:
  push:
    branches: [main]
  # Drafts run nothing (verify locally with `make ci-static`, which the
  # pre-push hook runs); ready_for_review starts the full gate, and drafts
  # cannot merge, so no unverified head lands.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    # Draft PRs run nothing (every job needs this one); marking the PR ready
    # for review triggers the full run.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mcp: ${{ steps.filter.outputs.mcp }}
      docker_backend: ${{ steps.filter.outputs.docker_backend }}
      docker_frontend: ${{ steps.filter.outputs.docker_frontend }}
      docker_mcp: ${{ steps.filter.outputs.docker_mcp }}
      docker_config: ${{ steps.filter.outputs.docker_config }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            mcp:
              - 'mcp/**'
            docker_backend:
              - 'backend/Dockerfile*'
              - 'backend/.dockerignore'
            docker_frontend:
              - 'frontend/Dockerfile*'
              - 'frontend/.dockerignore'
            docker_mcp:
              - 'mcp/Dockerfile*'
              - 'mcp/.dockerignore'
            docker_config:
              - 'docker/**'
              - '.env.docker.example'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'

  backend:
    name: Backend (lint / typecheck / tests)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # pgvector image so `alembic upgrade head` can CREATE EXTENSION vector
        # for the publication full-text RAG migration.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: hnf1b_user
          POSTGRES_PASSWORD: hnf1b_pass
          POSTGRES_DB: hnf1b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hnf1b_user -d hnf1b_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv-python
        with:
          working-directory: backend
          groups: dev test

      - name: Verify requirements exports match uv.lock
        working-directory: backend
        run: make check-requirements-drift

      - name: Run database migrations
        env:
          # ENVIRONMENT=development lets the backend job bypass the Wave 5c
          # production-only validators (email backend, AUTH_COOKIE_SECURE).
          # CI is not production; the validators are still exercised by
          # dedicated unit tests in backend/tests/test_config_*.py.
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://hnf1b_user:hnf1b_pass@localhost:5432/hnf1b_test
          JWT_SECRET: test-secret-key-for-ci
          ADMIN_PASSWORD: test-admin-password-ci-2026
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Check for schema drift (alembic check)
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://hnf1b_user:hnf1b_pass@localhost:5432/hnf1b_test
          JWT_SECRET: test-secret-key-for-ci
          ADMIN_PASSWORD: test-admin-password-ci-2026
        working-directory: backend
        run: uv run alembic check

      - name: Lint, format check, typecheck (same target as local pre-push)
        run: make ci-backend-static

      - name: Run tests (pytest, coverage, no network)
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://hnf1b_user:hnf1b_pass@localhost:5432/hnf1b_test
          JWT_SECRET: test-secret-key-for-ci
          ADMIN_PASSWORD: test-admin-password-ci-2026
        working-directory: backend
        # -n auto: pytest-xdist spawns one worker per core; each worker creates
        # and Alembic-migrates its own isolated DB (see backend/conftest.py).
        # pytest-cov auto-combines per-worker coverage data.
        run: uv run pytest -n auto --dist loadgroup -m "not benchmark and not network" --cov=app --cov=migration --cov-report=xml --cov-report=term-missing

      - name: Validate curated HPO labels against live ontology (network)
        # Guard against the hpo_terms_lookup labels drifting from the
        # authoritative HPO ontology. Runs serially (no xdist) so the network
        # guard is never folded into the coverage run. Transient API outages
        # skip rather than fail; only a real mismatch is red.
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://hnf1b_user:hnf1b_pass@localhost:5432/hnf1b_test
          JWT_SECRET: test-secret-key-for-ci
          ADMIN_PASSWORD: test-admin-password-ci-2026
        working-directory: backend
        run: uv run pytest -m network -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend (test / lint / format / build)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker_frontend == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify dependency consistency
        working-directory: frontend
        run: npm run check:dependencies

      - name: Lint, format check, unit tests + coverage (same target as local pre-push)
        run: make ci-frontend-static

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Verify no dev-auth strings in production bundle
        # Needs the dist/ build artifact, so it lives here (not in
        # prod-config-guards). Triggered on frontend OR frontend-Dockerfile
        # changes via this job's `if:`.
        working-directory: frontend
        run: |
          if grep -rqE "dev/login-as|DevQuickLogin|dev-admin|dev-curator|dev-viewer" dist/ --include='*.js' --include='*.css' 2>/dev/null; then
            echo "::error::dev-auth strings leaked into production bundle"
            grep -rnE "dev/login-as|DevQuickLogin|dev-admin|dev-curator|dev-viewer" dist/ --include='*.js' --include='*.css' || true
            exit 1
          fi
          echo "dev-auth strings are NOT in the production bundle"

  mcp:
    name: MCP server (lint / typecheck / unit tests / contract drift)
    needs: changes
    if: ${{ needs.changes.outputs.mcp == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv-python
        with:
          working-directory: mcp
          groups: dev

      - name: Lint, format check, typecheck, unit tests (same target as local pre-push)
        # Unit tests exclude 'live' (needs API+DB) and 'smoke' (needs the server).
        run: make ci-mcp

      - name: Contract drift guard (paths + enums)
        # Regenerate the deterministic, zero-dependency contract artifacts and
        # fail if the committed copies are stale. _generated_models.py is
        # intentionally excluded (needs datamodel-codegen from PyPI; flaky).
        working-directory: mcp
        run: |
          uv run python scripts/gen_contract.py
          git diff --exit-code -- src/hnf1b_mcp/contract/_generated_paths.py src/hnf1b_mcp/contract/_generated_enums.py

  e2e:
    name: E2E tests (Playwright ${{ matrix.shard }}/2)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # E2E is the critical path and runs one worker against one shared DB, so
    # parallelism comes from separate runners, each with its own stack.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        # pgvector image so `alembic upgrade head` can CREATE EXTENSION vector
        # for the publication full-text RAG migration.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: hnf1b_user
          POSTGRES_PASSWORD: hnf1b_pass
          POSTGRES_DB: hnf1b_phenopackets_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hnf1b_user -d hnf1b_phenopackets_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv-python
        with:
          working-directory: backend
          groups: dev test

      - name: Run backend migrations
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://hnf1b_user:hnf1b_pass@localhost:5432/hnf1b_phenopackets_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'CI_TEST_ONLY_NOT_A_REAL_SECRET_DO_NOT_REUSE_0000000000000000' }}
          ADMIN_PASSWORD: ci_test_admin_password_2026
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Seed admin user (required for E2E auth)
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://hnf1b_user:hnf1b_pass@localhost:5432/hnf1b_phenopackets_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'CI_TEST_ONLY_NOT_A_REAL_SECRET_DO_NOT_REUSE_0000000000000000' }}
          ADMIN_USERNAME: admin
          ADMIN_EMAIL: admin@hnf1b-db.local
          ADMIN_PASSWORD: ci_test_admin_password_2026
        working-directory: backend
        run: uv run python scripts/create_admin_user.py

      - name: Seed independent reviewer (required for approval)
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://hnf1b_user:hnf1b_pass@localhost:5432/hnf1b_phenopackets_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'CI_TEST_ONLY_NOT_A_REAL_SECRET_DO_NOT_REUSE_0000000000000000' }}
          ADMIN_PASSWORD: ci_test_admin_password_2026
        working-directory: backend
        run: uv run python scripts/seed_dev_users.py

      - name: Start backend
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://hnf1b_user:hnf1b_pass@localhost:5432/hnf1b_phenopackets_test
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'CI_TEST_ONLY_NOT_A_REAL_SECRET_DO_NOT_REUSE_0000000000000000' }}
          ADMIN_PASSWORD: ci_test_admin_password_2026
          REDIS_URL: redis://localhost:6379/0
        working-directory: backend
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1 || \
               curl -fsS http://localhost:8000/ >/dev/null 2>&1; then
              echo "backend is up"; break
            fi
            echo "waiting for backend... ($i)"; sleep 2
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          VITE_API_URL: http://localhost:8000/api/v2
          CI: "true"
          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: ci_test_admin_password_2026
          E2E_CURATOR_A_USERNAME: dev-curator-a
          E2E_CURATOR_A_PASSWORD: DevCuratorA!2026
          E2E_CURATOR_B_USERNAME: dev-curator-b
          E2E_CURATOR_B_PASSWORD: DevCuratorB!2026
          E2E_REVIEWER_USERNAME: dev-curator
          E2E_REVIEWER_PASSWORD: DevCurator!2026
        working-directory: frontend
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: backend-log-${{ matrix.shard }}
          path: /tmp/backend.log
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  prod-config-guards:
    name: Production config guards
    needs: changes
    if: ${{ needs.changes.outputs.docker_config == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Verify ENABLE_DEV_AUTH not truthy in prod compose
        # Catch every YAML-truthy spelling (mapping or list form, bare or
        # quoted). Moved out of the frontend job so Docker/compose-only PRs
        # still get this guard.
        run: |
          if grep -Eq "^[[:space:]]*(-[[:space:]]*)?ENABLE_DEV_AUTH[[:space:]]*[:=][[:space:]]*['\"]?(true|True|TRUE|yes|Yes|YES|on|On|ON|1)['\"]?[[:space:]]*$" docker/docker-compose.npm.yml; then
            echo "::error::ENABLE_DEV_AUTH must not be truthy in docker/docker-compose.npm.yml"
            grep -nE "^[[:space:]]*(-[[:space:]]*)?ENABLE_DEV_AUTH" docker/docker-compose.npm.yml || true
            exit 1
          fi
          echo "ENABLE_DEV_AUTH is not truthy in docker/docker-compose.npm.yml"

      - name: Verify ENVIRONMENT=production in prod compose
        run: |
          if ! grep -Eq "^\s*(-\s*)?ENVIRONMENT\s*[:=]\s*production" docker/docker-compose.npm.yml; then
            echo "::error::docker/docker-compose.npm.yml must set ENVIRONMENT=production explicitly"
            exit 1
          fi
          echo "ENVIRONMENT=production is pinned in docker/docker-compose.npm.yml"

  hygiene:
    name: Hygiene (pre-commit upstream hooks + grep guards)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          enable-cache: true
          cache-dependency-glob: .pre-commit-config.yaml

      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hygiene hooks (same target as local pre-push)
        run: make ci-hygiene

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, backend, frontend, mcp, e2e, prod-config-guards, hygiene]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify no required job failed or was cancelled
        # The single required status check. Conditional jobs that were skipped
        # report 'skipped' (allowed); only 'failure'/'cancelled' fail the gate.
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "Job results: $results"
          IFS=',' read -ra arr <<< "$results"
          for r in "${arr[@]}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required job reported '$r'"
              exit 1
            fi
          done
          echo "All required jobs succeeded or were skipped."
